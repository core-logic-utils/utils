<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruffle Player</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  #player { width:100%; height:100%; }
</style>
</head>
<body>
<div id="player"></div>

<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
(function () {
  // ← put the Bee Games SWF URL (or local filename) here
  const swf = "https://f.bee.games/flashpoint/_player/ruffle.html?swf=https%3A%2F%2Ff.bee.games%2Fflashpoint%2Fgames%2Fade7faf4-bf62-482a-bad7-2407a6dbe075%2Fcontent%2Fstaging.pbskids.org%2Fwordgirl%2Fprettyprincess%2Fgame%2FPP_Shell.swf";   // or "game.swf"

  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();
  player.style.width = "100%";
  player.style.height = "100%";
  document.getElementById("player").appendChild(player);
  player.load(swf);
})();
</script>
</body>
</html>
